name: 11-2-multi-diamension-matrix
on:
    workflow_dispatch:
jobs:
    test:
        strategy:
            fail-fast: false 
            #max-parallel: 1
            #max-parallel default is to run all matrix job at the same time 
            matrix:
                java-version: ['17','21']
                os: ['ubuntu-latest', 'windows-latest']
                exclude:
                # remove java 17 on windows from the matrix 
                  - java-version: '17'
                    os: 'windows-latest'
        name: Test- ${{matrix.java-version}} on ${{matrix.os}}
        runs-on: ${{matrix.os}}
        steps:
         - name: Chckout The Source Code
           uses: actions/checkout@v3
         - name: Setup Java ${{matrix.java-version}}
           uses: actions/setup-java@v4
           with:
             java-version: ${{matrix.java-version}}
             distribution: temurin
             cache: maven
         - run: mvn test
         - name: Show Matrix Combination
           run: |
             echo "Java version ${{matrix.java-version}}"
             echo "OS.          ${{matrix.os}} "
             echo "Runner OS is ${{runner.os}}"

# This creates 4 parallel jobs     