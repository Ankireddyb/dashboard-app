# ===================================================================
# Complete CI/CD workflow for Github Actions
# For our dashboard application 
#
# Flow :
# build-test > docker-build-push > deploy-to-dev > deploy-to-staging > deploy-to-prod (approval required ) > summary 
# We want to deploy our dashboard java application as serverless application to GCP Cloud run using Github Actions with OIDC Authentication
# Prerequsists:
#    GITHUB Secrets 
#           GCP_SERVICE_ACCOUNT # from gcp-oidc-setup.sh output 
#           GCP_WORKLOAD_IDENTITY_PROVIDER # from gcp-oidc-setup.sh output 
# GITHUB Environments 
#       development -> no protection rules 
#       staging     -> no protection rules 
#       production  -> required approval from team member 
# Place the image in Google Artifact Registry 
# Deploy the image to Cloud Run (serverless ) using OIDC authentication 
# ===================================================================

name: Dashboard app - CI/CD

on:
  push: 
    branches: 
      - main
    paths: 
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
  workflow_dispatch:

env:
  PROJECT_ID: jasmitha-dbs-payments
  REGION: us-central1
  GAR_REPO: dashboard-app
  IMAGE_NAME: dashboard-app
  SERVICE_NAME: dashboard-app
  APP_PORT: "8000"

permissions: 
  contents: read
  id-token: write # Required for OIDC authentication to GCP 

jobs: 
# ------------------ Job 1: Build Test and Package-------------------- #
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Checkout Code 
        uses: actions/checkout@v4

      - name: Set up JDK 21 
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin 
          cache: maven

      - name: Build and Test
        run: mvn clean package 

      - name: Generate image tag 
        id: tag
        run: |
          echo "value=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "imagetag: $(echo ${{ github.sha }} | cut -c1-7)"

# -------------------- Job 2 : Docker Build and Push to Google Artifact Registry ----------------#
  docker-build-push:
    name: Docker Build and Push to Artifact Registry 
    runs-on: ubuntu-latest
    needs: build-test
    outputs:
      full-image: ${{ steps.image.outputs.value }}
    permissions: 
      contents: read
      id-token: write  # Required for OIDC Authentication 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # Explicitly log into Artifact Registry using the OIDC token (fixes permission/push issues)
      - name: Login to Artifact Registry
        run: |
          gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin https://${{ env.REGION }}-docker.pkg.dev

      - name: Set full image name
        id: image
        run: |
          FULL_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ needs.build-test.outputs.image-tag }}"
          echo "value=$FULL_IMAGE" >> $GITHUB_OUTPUT
          echo "Full image : $FULL_IMAGE"

      - name: Docker Build
        run: |
          docker build -t ${{ steps.image.outputs.value }} -f Dockerfile .

      - name: Docker Push to Artifact Registry 
        run: |
          docker push ${{ steps.image.outputs.value }}
          echo "Image pushed : ${{ steps.image.outputs.value }} ✅"

# ---------------------- Job 3: Deploy to Dev (Automatic) -------------------- #
  deploy-to-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: [build-test, docker-build-push]
    environment:
      name: development
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run (Dev)
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }}-dev \
            --image=${{ needs.docker-build-push.outputs.full-image }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --platform=managed \
            --port=${{ env.APP_PORT }} \
            --allow-unauthenticated \
            --quiet

# -----------------------Job 4: Deploy to Stage (Automatic) ------------------ #
  deploy-to-stage:
    name: Deploy to Stage 
    runs-on: ubuntu-latest
    needs: [build-test, docker-build-push, deploy-to-dev]
    environment:
      name: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run (Stage)
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }}-stage \
            --image=${{ needs.docker-build-push.outputs.full-image }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --platform=managed \
            --port=${{ env.APP_PORT }} \
            --allow-unauthenticated \
            --quiet

# ----------------------- Job 5: Deploy to Prod (Approval Required) ----------- #
  deploy-to-production:
    name:  Deploy to Prod 
    runs-on: ubuntu-latest
    needs: [build-test, docker-build-push, deploy-to-stage]
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run (Prod)
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }}-prod \
            --image=${{ needs.docker-build-push.outputs.full-image }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --platform=managed \
            --port=${{ env.APP_PORT }} \
            --allow-unauthenticated \
            --quiet