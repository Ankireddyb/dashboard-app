name: CI-FullPromotion
on:
  workflow_dispatch:

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code 
        uses: actions/checkout@v3

      - name: Setup java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and package
        run: mvn package 

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: target/devops-dashboard-1.0.0.jar

  deploy-development:
    needs: build-package
    runs-on: ubuntu-latest
    environment: 
      name: development
      url: https://dev.i27academy.com
    steps:
      - name: Deploying to Development
        run: echo "Deploying to development environment"

  deploy-staging:
    needs: deploy-development
    runs-on: ubuntu-latest
    environment: 
      name: staging
      url: https://staging.i27academy.com
    steps:
      - name: Deploy to Staging 
        run: echo "Deploying to staging environment"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Deploy to Production
        run: echo "Deploying to production"
  print-summary:
    needs: [deploy-production]
    runs-on: ubuntu-latest
    steps:
      - name: Generate Workflow Summary
        run: |
          # Get short 7-character commit SHA
          SHORT_SHA="${GITHUB_SHA:0:7}"
          
          # Write summary to GitHub Step Summary
          echo "### 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag (Commit SHA):** \`$SHORT_SHA\`" >> $GITHUB_STEP_SUMMARY
          echo "**Development URL:** https://dev.i27academy.com" >> $GITHUB_STEP_SUMMARY
          echo "**Staging URL:** https://staging.i27academy.com" >> $GITHUB_STEP_SUMMARY
          echo "**Production URL:** https://prod.i27academy.com" >> $GITHUB_STEP_SUMMARY