name: Build ,test and Push Docker Image 
on:
    push: 
        branches: 
            - main
        paths: 
            - 'src/**'
            - 'pom.xml'
            - Dockerfile
env:
  DOCKER_IMAGE_NAME: 'anki918/dasboard-app'
jobs:
    # --------------- Job 1: Build , Test and Package ---------------
    build:
        name: build
        runs-on: ubuntu-latest
        outputs:
          image-tag: ${{steps.tag.outputs.value}}
        steps:
            - name: Checkout code 
              uses: actions/checkout@v3
            - name: Setup Java 21
              uses: actions/setup-java@v4
              with:
                java-version: 21
                distribution: temurin
                cache: maven
            - name: Build Test and Package
              run: mvn clean package 
            - name: Upload Build Artifact
              uses: actions/upload-artifact@v4
              with:
                name: build-artifact
                path: target/*.jar
                retention-days: 7
            - name: Docker Image Tag 
              id: tag

              run: |
               echo " ------------- Creating Docker Image Tag ------------------"
               echo "value=${{github.sha}}" >> $GITHUB_OUTPUT


    # --------------- Job 2: Docker Build and Push  ---------------           
    docker-build-push:
      name: Docker Build and Push 
      runs-on: ubuntu-latest
      needs: build
      steps:
        - name: Checkout Code 
          uses: actions/checkout@v3
        - name: Login to Docker Hub
          uses: docker/login-action@v4
          with:
            username: ${{vars.DOCKERHUB_USERNAME}}
            password: ${{secrets.DOCKERHUB_TOKEN}}
        - name: Build Docker Image 
          run: |
           echo "-------------Building Docker Image ---------------------- "
           docker build \
              -t ${{ env.DOCKER_IMAGE_NAME }}:${{ needs.build.outputs.image-tag }} \
              .
        - name: Push Docker Image 
          run: |
           echo "-------------- Pushing Docker Image --------------"
           docker push "${{ env.DOCKER_IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}"
        - name: Docker Image Details 
          run: |
            echo "------------------------------"
            echo "Docker Image Pushed Successfully "
            echo "-----------------------------------"
            echo "Repository       : ${{env.DOCKER_IMAGE_NAME}}"
            echo "Tag is           : ${{needs.build.outputs.image-tag}}"
            echo "Full Image is    :  ${{env.DOCKER_IMAGE_NAME}}: ${{needs.build.outputs.image-tag}}"
            echo "-----------------------------------------"
    #-----------------   Job 3 : Deploy to Dev(Automatic)
    deploy-dev:
      name: Deploy to Dev
      runs-on: ubuntu-latest
      needs:   [build,docker-build-push]
      environment:
        name: development
        url: https://dev.jasmikatech.com
      steps: 
        - name: Deploy to Development
          run: |
           echo "--------------------------"
           echo "Deploying to Development Environment "
           echo "Deployed ✅"
    # ---------------------------- Job 4: Deploy to Stage (Automatic)
    deploy-stage:
      name: Deploy to Stage
      runs-on: ubuntu-latest
      needs: [build, docker-build-push,deploy-dev]
      environment:
        name: staging
        url: https://stage.jasmikatech.com
      steps:
        - name : Deploy to Stagging 
          run: |
           echo "----------------------------"
           echo "Deploying to Staging Environment "
           echo "Deployed ✅"
    #----------------------------- Job 5: Deploy to Production (Manually , Required Approval ) -------------
    deploy-prod:
      name: Deploy to Prod
      runs-on: ubuntu-latest
      needs: [build, docker-build-push,deploy-dev,deploy-stage] 
      environment:
        name: production
        url: https://jasmikatech.com
      steps:
        - name: Deploy to Prod
          run: |
           echo "-----------------------------" 
           echo "Deploying to Production Evironment  "
           echo "Deployed ✅"
    #---------------------------- Job 6: Summary Job , Always run --------------------
    summary: 
      name: Deployment summary 
      runs-on: ubuntu-latest
      needs: [build, docker-build-push,deploy-dev,deploy-stage,deploy-prod] 
      if: always()
      steps:
        - name: Overall Summary 
          run: |
           echo "## Deployment Summary " >> $GITHUB_STEP_SUMMARY
           echo "| Environment | Status | URl " >> $GITHUB_STEP_SUMMARY
           echo "|------| ------| -----| ">> $GITHUB_STEP_SUMMARY
           echo "|Development| ${{needs.deploy-dev.result}}|https://dev.jasmikatech.com">> $GITHUB_STEP_SUMMARY
           echo "|Stagging| ${{needs.deploy-stage.result}}|https://stage.jasmikatech.com">> $GITHUB_STEP_SUMMARY
           echo "|Production| ${{needs.deploy-prod.result}}|https://jasmikatech.com">> $GITHUB_STEP_SUMMARY


