name: 13-1-without-custom-actions
on:
    workflow_dispatch:
jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Code
          uses: actions/checkout@v3       # Repeated
        - name: Setup Java 21 
          uses: actions/setup-java@v4       # Repeated
          with:
            java-version: '21'
            distribution: temurin
            cache: maven
        - name: Run Tests
          run: |
            echo "************* Running Test Cases ******************"
            mvn test
        - name: Upload Test Reportds
          uses: actions/upload-artifact@v4    # Repeated
          with:
            name: surefire-reports
            path: target/surefire-reports
            retention-days: 7
    build:
        name: Build
        runs-on: ubuntu-latest
        needs: test
        steps:
          - name: Checkout Code
            uses: actions/checkout@v3   # Repeated
          - name: Setup Java 21
            uses: actions/setup-java@v4   # Repeated 
            with:
              java-version: '21'
              distribution: temurin
              cache: maven
          - name: Build Jar 
            run: mavn package -DskipTests
          - name: Upload Jar 
            uses: actions/upload-artifact@v4.  # Repeated 
            with:
               name: devops-dashboard-jar
               path: target/evops-dashboard-1.0.0.jar
               retention-days: 7