name: Devops Dashboard-CI
on:
    push:
        branches: 
            - main
        paths:
            - 'src/**'
            - 'pom.xml'
            - 'Dockerfile'
    pull_request: 
        branches: 
            - main
        types: 
             - opened
             - synchronize
             - reopened

    workflow_dispatch:
        
jobs:
    # -------------------Job 1: Test ----------------------
    test: # job-id > This can be used if i want to refer this job 
       name: Run Tests
       runs-on: ubuntu-latest
       steps:
          - name: checkout the code 
            uses: actions/checkout@v3
          - name: setup Java 21
            uses: actions/setup-java@v4
            with: 
                java-version: '21'
                distribution: temurin
                cache: maven
          - name: Run Tests
            run: mvn test
          - name: Upload Test Reports 
            uses: actions/upload-artifact@v4
            with:
                name: surefire-reports
                path: target/-surefire-reports/
                retention-days: 7
                

