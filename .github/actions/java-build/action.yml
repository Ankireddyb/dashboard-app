name: Java Build Action
description: |
  Composite Action for jasmikatech.com for Java Services. 
  Handles checkout , java setup and maven build .
  Eliminates repeated steps across workflows .

inputs:
  java-version:
    description: Java version to use
    required: false
    default: '21'
  distribution:
    description: Java distribution
    required: false
    default: temurin
  run-tests:
    description: Run Tests before building (true / false)
    required: false
    default: 'true'
  working-directory:
    description: Directory to run maven commands in 
    required: false
    default: '.'

outputs:
  jar-path:
    description: Path to the built jar file 
    value: ${{ steps.build.outputs.jar-path }}
  test-result:
    description: Result of the test run - passed or skipped
    value: ${{ steps.test.outputs.result }}

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Java ${{ inputs.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}
        cache: maven

    - name: Run tests
      id: test
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: | 
        mvn test
        echo "result=passed" >> $GITHUB_OUTPUT

    - name: Set test skipped output
      id: test_skipped
      if: ${{ inputs.run-tests != 'true' }}
      shell: bash
      run: |
        echo "result=skipped" >> $GITHUB_OUTPUT

    - name: Build Jar
      id: build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        mvn package -DskipTests
        JAR=$(find target -name "*.jar" | head -1)
        echo "jar-path=$JAR" >> $GITHUB_OUTPUT
        echo "Packaging done !!!"
        echo "Built Jar: $JAR"


#=============================================================
# KEY RULES for Compiste actions :
# 1. shell: bash is required on every run : step 
# unlike regular workflows , shell is not inherited 
# 2. inputs.* accesses inputs defined above 
# 3. outputs.value must point to a step output 
# --> step mush have id: for this to work 
# 4 . using: composite - always this for step-based actions 