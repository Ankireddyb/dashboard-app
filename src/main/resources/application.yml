server:
  port: 8000

spring:
  application:
    name: i27academy-devops-dashboard
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/i27dashboard}
    username: ${DB_USERNAME:i27user}
    password: ${DB_PASSWORD:i27pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  thymeleaf:
    cache: false

app:
  name: i27academy DevOps Dashboard
  version: 1.0.0
  description: Track deployments, pipeline runs, and service health across your engineering org
  environment: ${ENVIRONMENT:development}
